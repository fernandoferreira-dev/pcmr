services:
  spring-app:
    build: .
    container_name: spring_app_container
    ports:
      - "8080:8080"
    environment:
      # Use host.docker.internal to point back to your local computer
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/pcmr
      SPRING_DATASOURCE_USERNAME: diogo
      SPRING_DATASOURCE_PASSWORD: 1234
    extra_hosts:
      # Crucial setting for Linux users to enable host.docker.internal
      - "host.docker.internal:host-gateway"

  web:
    image: nginx
    volumes:
      - ./templates:/etc/nginx/templates
    ports:
      - "8081:80"
    environment:
      - NGINX_HOST=foobar.com
      - NGINX_PORT=80

  mqtt5:
    image: eclipse-mosquitto
    container_name: mqtt5
    ports:
      - "1883:1883" #default mqtt port
      - "9001:9001" #default mqtt port for websockets
    volumes:
      - ./config:/mosquitto/config:rw
      - ./data:/mosquitto/data:rw
      - ./log:/mosquitto/log:rw
    restart: unless-stopped

volumes:
  config:
  data:
  log:

networks:
  default:
    name: mqtt5-network
